apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - pathType: ImplementationSpecific
#            path: /api/v1/beer/[^/]+/inventory
            path: /api/v1/beer/(.*)+/inventory
            backend:
              service:
                name: inventory-service
                port:
                  number: 8082
          - pathType: Prefix
            path: /api/v1/beer
            backend:
              service:
                name: beer-service
                port:
                  number: 8080
          - pathType: Prefix
            path: /api/v1/beerUpc
            backend:
              service:
                name: beer-service
                port:
                  number: 8080
          - pathType: Prefix
            path: /api/v1/customers/
            backend:
              service:
                name: order-service
                port:
                  number: 8081